name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions"
      - name: Get the code
        uses: actions/checkout@v7
      - name: List the files
        run: ls
      - name: Check the home page has a heading
        run: grep "<h1>" index.html